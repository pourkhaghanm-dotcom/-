<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213d">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>حساب‌کتاب من</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#14213d;--mute:#6b7788;--line:#e3e8ee;--in:#1b8a6b;--ex:#d1495b;--acc:#2f4fd8;--accT:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--card:#18212f;--ink:#e8edf5;--mute:#8d9bb0;--line:#263246;--in:#3ec9a0;--ex:#ff7b8c;--acc:#7f98ff;--accT:#0e1420}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif}
body{max-width:520px;margin:0 auto;padding:12px 14px 110px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.nav b{font-size:20px;font-weight:800}
.nav button{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:20px;border:1px solid var(--line)}
.hero{background:var(--ink);color:var(--bg);border-radius:20px;padding:20px}
.hero small{opacity:.7;font-size:13px}
.hero .big{font-size:32px;font-weight:800;margin:2px 0 14px}
.hero .row{display:flex;gap:10px}
.hero .row div{flex:1;background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;font-size:13px}
.hero .row b{display:block;font-size:16px;margin-top:2px}
.sec{font-weight:800;margin:20px 4px 8px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.tx{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.tx .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none}
.tx .t{flex:1;min-width:0}.tx .t div{font-weight:600;font-size:14px}.tx .t small{color:var(--mute);font-size:12px}
.tx .a{font-weight:800;font-size:14px;white-space:nowrap}
.tx .x{color:var(--mute);font-size:18px;padding:4px 6px}
.in{color:var(--in)}.ex{color:var(--ex)}
.empty{color:var(--mute);text-align:center;padding:26px 0;font-size:14px}
.bar{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px}
.bar span:first-child{width:62px}.bar .tr{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--ex);border-radius:6px}
.bar span:last-child{width:84px;text-align:left;font-weight:600}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs div{display:flex;width:100%;max-width:520px;gap:6px}
.tabs button{flex:1;padding:8px 0;border-radius:12px;font-size:12px;color:var(--mute);font-weight:600}
.tabs button.on{background:var(--bg);color:var(--acc)}
.tabs button span{display:block;font-size:20px}
.fab{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom,0px));left:18px;width:58px;height:58px;border-radius:50%;background:var(--acc);color:var(--accT);font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:5}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:12px;color:var(--mute);padding:4px 0}
.cal button{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;position:relative}
.cal button.today{border-color:var(--acc)}.cal button.sel{background:var(--acc);color:var(--accT)}
.cal button i{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);display:flex;gap:3px}
.cal button i b{width:5px;height:5px;border-radius:50%}
.chart{display:flex;align-items:flex-end;justify-content:space-around;height:170px;padding:10px 0 0}
.chart>div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.chart .pair{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:140px}
.chart .pair i{width:14px;border-radius:5px 5px 0 0;min-height:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 4px;text-align:center;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}tr:last-child td{border:0}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mute);margin:8px 4px 0}.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 12px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg button.on.i{color:var(--in)}.seg button.on.e{color:var(--ex)}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
input.amt{font-size:22px;font-weight:800;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{padding:7px 12px;border-radius:20px;background:var(--bg);border:1px solid var(--line);font-size:13px}
.chips button.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.dt{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.save{width:100%;padding:14px;border-radius:14px;background:var(--acc);color:var(--accT);font-weight:800;font-size:16px;margin-top:4px}
.hint{color:var(--mute);font-size:12px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const EX=[['خوراک','🍽️'],['اجاره','🏠'],['قبوض','💡'],['حمل‌ونقل','🚌'],['خرید','🛍️'],['سلامت','💊'],['تفریح','🎬'],['سایر','📦']];
const IN=[['حقوق','💼'],['پاداش','🎁'],['سایر درآمد','💰']];
const ico=c=>([...EX,...IN].find(x=>x[0]===c)||[0,'💳'])[1];
const fa=n=>Number(n).toLocaleString('fa-IR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const leap=y=>[1,5,9,13,17,22,26,30].includes(y%33);
const mlen=(y,m)=>m<=6?31:m<=11?30:(leap(y)?30:29);
function today(){try{const p=new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date());const g=t=>parseInt(p.find(x=>x.type===t).value);return{y:g('year'),m:g('month'),d:g('day')}}catch(e){return{y:1405,m:1,d:1}}}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+~~(jy/33)*8+~~((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*~~(days/146097);days%=146097;if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++}gy+=4*~~(days/1461);days%=1461;if(days>365){gy+=~~((days-1)/365);days=(days-1)%365}let gd=days+1;const s=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13;gm++){if(gd<=s[gm])break;gd-=s[gm]}return[gy,gm,gd]}
const firstWd=(y,m)=>{const[a,b,c]=j2g(y,m,1);return(new Date(a,b-1,c).getDay()+1)%7};

let TX=[];try{TX=JSON.parse(localStorage.getItem('hk_tx')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('hk_tx',JSON.stringify(TX))}catch(e){}};
const T=today();let cur={y:T.y,m:T.m},tab='home',selDay=T.d;

const inM=(y,m)=>TX.filter(t=>t.y===y&&t.m===m);
const sum=(a,ty)=>a.filter(t=>t.type===ty).reduce((s,t)=>s+t.amt,0);
const srt=a=>[...a].sort((p,q)=>q.d-p.d||q.id-p.id);
function shift(n){let m=cur.m+n,y=cur.y;if(m>12){m=1;y++}if(m<1){m=12;y--}cur={y,m};selDay=(y===T.y&&m===T.m)?T.d:1;render()}
const navH=()=>`<div class="nav"><button onclick="shift(1)">›</button><b>${MN[cur.m-1]} ${fa(cur.y).replace(/٬/g,'')}</b><button onclick="shift(-1)">‹</button></div>`;
function txH(a){if(!a.length)return'<div class="empty">هنوز چیزی ثبت نشده. با دکمه + شروع کن.</div>';
return a.map(t=>`<div class="tx"><div class="dot" style="background:${t.type==='in'?'rgba(27,138,107,.15)':'rgba(209,73,91,.15)'}">${ico(t.cat)}</div><div class="t"><div>${t.cat}</div><small>${fa(t.d)} ${MN[t.m-1]}${t.note?' · '+esc(t.note):''}</small></div><div class="a ${t.type}">${t.type==='in'?'+':'−'}${fa(t.amt)}</div><button class="x" onclick="del(${t.id})">✕</button></div>`).join('')}
function del(id){if(confirm('این مورد حذف شود؟')){TX=TX.filter(t=>t.id!==id);save();render()}}

function home(){const a=inM(cur.y,cur.m),i=sum(a,'in'),e=sum(a,'ex'),r=i-e;
const cats={};a.filter(t=>t.type==='ex').forEach(t=>cats[t.cat]=(cats[t.cat]||0)+t.amt);
const cl=Object.entries(cats).sort((p,q)=>q[1]-p[1]);
return navH()+`<div class="hero"><small>مانده این ماه (تومان)</small><div class="big">${r<0?'−':''}${fa(Math.abs(r))}</div><div class="row"><div>درآمد / حقوق<b>${fa(i)}</b></div><div>هزینه<b>${fa(e)}</b></div></div></div>`+
(cl.length?`<div class="sec">هزینه‌ها به تفکیک دسته</div><div class="card">${cl.map(([c,v])=>`<div class="bar"><span>${ico(c)} ${c}</span><span class="tr"><i style="width:${Math.round(v/e*100)}%"></i></span><span>${fa(v)}</span></div>`).join('')}</div>`:'')+
`<div class="sec">تراکنش‌های این ماه</div><div class="card">${txH(srt(a))}</div>`}

function calendar(){const n=mlen(cur.y,cur.m),off=firstWd(cur.y,cur.m),a=inM(cur.y,cur.m);
let c='<div class="cal">'+['ش','ی','د','س','چ','پ','ج'].map(d=>`<div class="wd">${d}</div>`).join('')+'<span></span>'.repeat(off);
for(let d=1;d<=n;d++){const x=a.filter(t=>t.d===d);const hi=x.some(t=>t.type==='in'),he=x.some(t=>t.type==='ex');
c+=`<button class="${d===selDay?'sel':''} ${cur.y===T.y&&cur.m===T.m&&d===T.d?'today':''}" onclick="selDay=${d};render()">${fa(d)}${x.length?`<i>${hi?'<b style="background:var(--in)"></b>':''}${he?'<b style="background:var(--ex)"></b>':''}</i>`:''}</button>`}
c+='</div>';const dl=a.filter(t=>t.d===selDay);
return navH()+c+`<div class="sec">${fa(selDay)} ${MN[cur.m-1]}</div><div class="card">${dl.length?txH(dl):'<div class="empty">در این روز چیزی ثبت نشده.</div>'}</div>`}

function compare(){const ms=[];let y=cur.y,m=cur.m;for(let k=0;k<6;k++){ms.unshift({y,m});m--;if(m<1){m=12;y--}}
const d=ms.map(o=>{const a=inM(o.y,o.m);return{...o,i:sum(a,'in'),e:sum(a,'ex')}});
const mx=Math.max(1,...d.flatMap(o=>[o.i,o.e]));
const ch=d.map(o=>`<div><div class="pair"><i style="height:${o.i/mx*100}%;background:var(--in)"></i><i style="height:${o.e/mx*100}%;background:var(--ex)"></i></div>${MN[o.m-1]}</div>`).join('');
const rows=[...d].reverse().map((o,k,arr)=>{const r=o.i-o.e;const p=arr[k+1];const df=p?o.e-p.e:null;
return`<tr><td>${MN[o.m-1]}</td><td class="in">${fa(o.i)}</td><td class="ex">${fa(o.e)}</td><td style="font-weight:800">${r<0?'−':''}${fa(Math.abs(r))}</td></tr>`}).join('');
const c=d[5],p=d[4];let msg='';
if(p&&(p.e||c.e)){const df=c.e-p.e;msg=df===0?'هزینه‌ات با ماه قبل برابر بوده.':`هزینه‌ات نسبت به ماه قبل ${fa(Math.abs(df))} تومان ${df>0?'بیشتر':'کمتر'} شده.`}
return navH()+(msg?`<div class="card" style="padding:14px;font-weight:600;font-size:14px">${msg}</div>`:'')+`<div class="sec">۶ ماه اخیر</div><div class="card" style="padding:10px 14px"><div class="chart">${ch}</div></div><div class="legend"><span><b style="background:var(--in)"></b>درآمد</span><span><b style="background:var(--ex)"></b>هزینه</span></div><div class="sec">جدول مقایسه (تومان)</div><div class="card"><table><tr><th>ماه</th><th>درآمد</th><th>هزینه</th><th>مانده</th></tr>${rows}</table></div>`}

function render(){const v=tab==='home'?home():tab==='cal'?calendar():compare();
document.getElementById('app').innerHTML=v+`<button class="fab" onclick="openAdd()" aria-label="افزودن">+</button><div class="tabs"><div>${[['home','🏠','خانه'],['cal','🗓️','تقویم'],['cmp','📊','مقایسه ماه‌ها']].map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()"><span>${i}</span>${l}</button>`).join('')}</div></div>`}

let F={};
function openAdd(){const d=(tab==='cal')?selDay:(cur.y===T.y&&cur.m===T.m?T.d:1);F={type:'ex',cat:'خوراک',y:cur.y,m:cur.m,d};sheet()}
function sheet(){const cats=F.type==='ex'?EX:IN;
document.getElementById('modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="sheet"><h3>ثبت تراکنش جدید</h3>
<div class="seg"><button class="e ${F.type==='ex'?'on':''}" onclick="setType('ex')">هزینه</button><button class="i ${F.type==='in'?'on':''}" onclick="setType('in')">درآمد / حقوق</button></div>
<input id="amt" class="amt" inputmode="numeric" placeholder="مبلغ (تومان)" value="${F.amt?fa(F.amt):''}" oninput="fmt(this)">
<div class="chips">${cats.map(([c,i])=>`<button class="${F.cat===c?'on':''}" onclick="F.cat='${c}';keep();sheet()">${i} ${c}</button>`).join('')}</div>
<div class="dt"><select id="sd" onchange="F.d=+this.value">${Array.from({length:mlen(F.y,F.m)},(_,k)=>`<option value="${k+1}" ${F.d===k+1?'selected':''}>${fa(k+1)}</option>`).join('')}</select>
<select id="sm" onchange="F.m=+this.value;F.d=Math.min(F.d,mlen(F.y,F.m));keep();sheet()">${MN.map((n,k)=>`<option value="${k+1}" ${F.m===k+1?'selected':''}>${n}</option>`).join('')}</select>
<select id="sy" onchange="F.y=+this.value;F.d=Math.min(F.d,mlen(F.y,F.m));keep();sheet()">${[T.y-3,T.y-2,T.y-1,T.y,T.y+1].map(y=>`<option value="${y}" ${F.y===y?'selected':''}>${fa(y).replace(/٬/g,'')}</option>`).join('')}</select></div>
<input id="note" placeholder="توضیح (اختیاری)" value="${esc(F.note||'')}" oninput="F.note=this.value">
<button class="save" onclick="addTx()">ذخیره</button></div></div>`}
const closeM=()=>document.getElementById('modal').innerHTML='';
function setType(t){F.type=t;F.cat=t==='ex'?'خوراک':'حقوق';keep();sheet()}
function keep(){}
function num(s){return parseInt(String(s).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/\D/g,''))||0}
function fmt(el){F.amt=num(el.value);el.value=F.amt?fa(F.amt):''}
function addTx(){if(!F.amt){document.getElementById('amt').focus();return}
TX.push({id:Date.now(),type:F.type,amt:F.amt,cat:F.cat,y:F.y,m:F.m,d:F.d,note:(F.note||'').trim()});save();
cur={y:F.y,m:F.m};selDay=F.d;closeM();render()}
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
